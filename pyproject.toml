[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-feedback-loop"
version = "0.1.0"
description = "AMC Human Feedback Loop module — captures feedback_records, builds unified evaluation records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic==2.7.1",
    "vaderSentiment==3.3.1",
    "spacy==3.7.4",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "httpx==0.27.0",
    "tenacity==8.3.0",
    "python-dateutil==2.9.0",
    "structlog==24.1.0",
    # Database adapters (ORM and drivers)
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",  # PostgreSQL driver (production)
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "freezegun==1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q -p no:langsmith"
